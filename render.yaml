services:
  - type: web
    name: ehmet-web
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ehmet-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false

databases:
  - name: ehmet-db
    region: frankfurt
    databaseName: ehmet
    user: ehmet
    ipAllowList: []
